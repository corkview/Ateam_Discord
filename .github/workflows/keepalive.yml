name: Repo Keepalive

# GitHub auto-disables scheduled workflows after 60 days with no commits
# to the repository (cron runs don't count). This makes a trivial monthly
# commit so daily-events.yml / event-watcher.yml don't silently stop firing.

on:
  schedule:
    - cron: '0 12 1 * *'   # 1st of each month, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive file
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: monthly keepalive commit to prevent workflow auto-disable"
          git push
